# Gold set: screening questions grouped into six ATS-style forms, crossed with the
# six profiles in profiles.yaml.
#
# gold values (per profile key, `all` = default for every profile):
#   "<text>"          the one correct answer (an option, a profile value, or a number)
#   [a, b]            any of these is correct
#   ESSAY             free-text essay; scored separately
#   ABSTAIN           the profile does not hold the answer; any fill is a misfill
#   "ABSTAIN|<v>"     ABSTAIN, but filling <v> is tolerated (an absence-based
#                     negative such as "No"/"None" that a person would probably
#                     give). Tolerated fills are neither correct nor misfills.
#
# Labelling rules:
#   - An answer must be justified by the profile fixture. Not stated -> ABSTAIN.
#   - "No" is gold only when the profile says so explicitly (or the dates show it,
#     e.g. no gaps); an absence of evidence is ABSTAIN (usually "ABSTAIN|No").
#   - EEO "decline" options are gold only for the profile that declines (sales).
#     A blank EEO value is ABSTAIN (strict): nobody chose to decline.
#   - Legal attestations (felony, drug screen, non-compete, relatives, terminated)
#     are always strict ABSTAIN.
#   - Years are computed from role dates with the end month inclusive, Present =
#     2026-09, overlapping roles merged, gaps excluded, floored. A skill's years
#     count only roles whose title/bullets mention the skill.
#
# kinds: legal, eeo, logistics, experience, short_text, essay, trap

forms:
  - id: greenhouse
    ats: Greenhouse
    job: {job_id: gh-4471, title: Customer Success Manager, company: Pixelworks,
          url: "https://boards.greenhouse.io/pixelworks/jobs/4471",
          description: "Pixelworks is hiring a Customer Success Manager in Portland, OR to own onboarding and renewals for a book of mid-market SaaS accounts."}
    questions:
      - id: gh_auth
        kind: legal
        field: {label: "Are you legally authorized to work in the United States?", field_type: select, options: ["Yes", "No"], required: true}
        gold: {all: "Yes"}
      - id: gh_sponsor
        kind: legal
        field: {label: "Will you now or in the future require sponsorship for employment visa status (e.g. H-1B visa status)?", field_type: select, options: ["Yes", "No"], required: true}
        gold: {all: "No", marketer: "Yes"}
      - id: gh_prev_employed
        kind: trap
        field: {label: "Have you ever been employed by Pixelworks?", field_type: select, options: ["Yes", "No"]}
        gold: {all: "ABSTAIN|No", csm: "Yes"}
      - id: gh_relatives
        kind: trap
        field: {label: "Do you have any relatives currently employed by Pixelworks?", field_type: select, options: ["Yes", "No"]}
        gold: {all: ABSTAIN}
      - id: gh_linkedin
        kind: short_text
        field: {label: "LinkedIn Profile", field_type: text}
        gold: {sysadmin: "https://www.linkedin.com/in/jordan-blake-example", marketer: "https://www.linkedin.com/in/priya-nair-example",
               sales: "https://www.linkedin.com/in/marcus-reed-example", csm: "https://www.linkedin.com/in/elena-petrova-example",
               junior_dev: "https://www.linkedin.com/in/sam-okafor-example", assistant: ABSTAIN}
      - id: gh_website
        kind: short_text
        field: {label: "Website", field_type: text}
        gold: {all: ABSTAIN, marketer: "https://priyanair-example.com", junior_dev: "https://samokafor-example.dev",
               sysadmin: "ABSTAIN|https://github.com/jblake-example"}
      - id: gh_years_cs
        kind: experience
        field: {label: "How many years of customer success experience do you have?", field_type: number}
        gold: {all: "ABSTAIN|0", csm: "6"}
      - id: gh_salesforce
        kind: experience
        field: {label: "How many years of experience do you have with Salesforce?", field_type: number}
        gold: {all: "ABSTAIN|0", sales: "7", csm: "1"}
      - id: gh_ccsm
        kind: experience
        field: {label: "Are you a Certified Customer Success Manager (CCSM)?", field_type: radio, options: ["Yes", "No"]}
        gold: {all: "ABSTAIN|No", csm: "Yes"}
      - id: gh_gender
        kind: eeo
        field: {label: "Gender", field_type: select, options: [Male, Female, Decline To Self Identify], extra_context: "Voluntary Self-Identification"}
        gold: {sysadmin: Male, marketer: Female, sales: Decline To Self Identify, csm: Female, junior_dev: Male, assistant: Female}
      - id: gh_hispanic
        kind: eeo
        field: {label: "Are you Hispanic/Latino?", field_type: select, options: ["Yes", "No", Decline To Self Identify], extra_context: "Voluntary Self-Identification"}
        gold: {all: "ABSTAIN|No", assistant: "Yes", sales: Decline To Self Identify}
      - id: gh_veteran
        kind: eeo
        field: {label: "Veteran Status", field_type: select, options: [I am not a protected veteran, I identify as one or more of the classifications of protected veteran, "I don't wish to answer"]}
        gold: {all: I am not a protected veteran, sales: "I don't wish to answer",
               assistant: I identify as one or more of the classifications of protected veteran}
      - id: gh_disability
        kind: eeo
        field: {label: "Disability Status", field_type: select, options: ["Yes, I have a disability, or have had one in the past", "No, I do not have a disability and have not had one in the past", I do not want to answer]}
        gold: {all: "No, I do not have a disability and have not had one in the past", marketer: ABSTAIN, sales: I do not want to answer}
      - id: gh_why
        kind: essay
        field: {label: "Why do you want to work at Pixelworks?", field_type: textarea}
        gold: {all: ESSAY}

