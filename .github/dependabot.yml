# Automated dependency update PRs — one weekly batch per ecosystem.
# Security advisories additionally open PRs as soon as they're published,
# regardless of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # browser-use 1.x rebuilds its LLM layer on pydantic-ai, and
      # backend/browser_use_agent.py was written and tested against 0.13.
      # Port and test it by hand before taking the major bump.
      - dependency-name: browser-use
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-deps:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
